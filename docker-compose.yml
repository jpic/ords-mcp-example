# ORDS MCP lab: Oracle Free + ORDS (Auth0 JWT)
#
#   cp .env.example .env   # set AUTH0_* — see docs/AUTH0_SETUP.md
#   docker compose up -d --build
#   MCP: http://localhost:8080/mcp

services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: ords-oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_PWD:-OracleFree123}
      APP_USER: ${APP_USER:-app}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-AppUser123}
    ports:
      - "${ORACLE_HOST_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./sql:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 90s
    networks:
      - ords-net

  ords:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ORDS_URL: ${ORDS_URL:-https://download.oracle.com/otn_software/java/ords/ords-latest.zip}
    image: local/ords:latest
    container_name: ords
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      ORDS_MODE: ${ORDS_MODE:-mcp}
      DB_HOST: oracle
      DB_PORT: "1521"
      DB_SERVICE: ${DB_SERVICE:-FREEPDB1}
      ORACLE_PWD: ${ORACLE_PWD:-OracleFree123}
      ORDS_HTTP_PORT: "8080"
      ORDS_ENABLE_HTTPS: ${ORDS_ENABLE_HTTPS:-"false"}
      WAIT_FOR_DB: "true"
      DB_WAIT_TIMEOUT: "300"
      DB_SETTLE_SECONDS: ${DB_SETTLE_SECONDS:-30}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://ords.lab/mcp}
      AUTH0_ISSUER: ${AUTH0_ISSUER:-}
      AUTH0_JWKS_URL: ${AUTH0_JWKS_URL:-}
      AUTH0_AUTHORIZE_URL: ${AUTH0_AUTHORIZE_URL:-}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      JWT_JWKS_URL: ${JWT_JWKS_URL:-}
      JWT_AUTH_SERVER_URL: ${JWT_AUTH_SERVER_URL:-}
      MCP_ROLE_CLAIM: ${MCP_ROLE_CLAIM:-/roles}
      MCP_HR_DB_USER: ${MCP_HR_DB_USER:-HR_MCP_RO}
      MCP_HR_DB_PASSWORD: ${MCP_HR_DB_PASSWORD:-HrMcp_ChangeMe1}
      MCP_FIN_DB_USER: ${MCP_FIN_DB_USER:-FIN_MCP_RO}
      MCP_FIN_DB_PASSWORD: ${MCP_FIN_DB_PASSWORD:-FinMcp_ChangeMe1}
      MCP_HR_ROLE: ${MCP_HR_ROLE:-POOL.HR}
      MCP_FIN_ROLE: ${MCP_FIN_ROLE:-POOL.FIN}
      MCP_HR_POOL_NAME: ${MCP_HR_POOL_NAME:-mcp-hr}
      MCP_FIN_POOL_NAME: ${MCP_FIN_POOL_NAME:-mcp-fin}
    ports:
      - "${ORDS_HTTP_PORT:-8080}:8080"
      - "${ORDS_HTTPS_PORT:-8443}:8443"
    # Host resolver (192.168.x) sometimes fails inside containers for Auth0 CDN
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ords-config:/etc/ords/config
    networks:
      - ords-net
    restart: unless-stopped

networks:
  ords-net:
    driver: bridge

volumes:
  oracle-data:
  ords-config:
