# Lab stack: Oracle Free + ORDS MCP (Auth0).
# Production image build: ./deploy/docker/build.sh
# Production K8s: deploy/k8s/ords-mcp
#
#   cp .env.example .env   # AUTH0_* required
#   docker compose up -d --build

services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: ords-oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_PWD:-OracleFree123}
      APP_USER: ${APP_USER:-app}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-AppUser123}
    ports:
      - "${ORACLE_HOST_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./sql:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 90s
    networks:
      - ords-net

  ords:
    build:
      context: .
      dockerfile: Dockerfile
    image: yourlabs/ords:lab
    container_name: ords
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      ORDS_LAB_BOOTSTRAP: "true"
      ORDS_AUTO_INIT: "true"
      ORDS_RECONFIGURE: "true"
      DB_HOST: oracle
      DB_PORT: "1521"
      DB_SERVICE: ${DB_SERVICE:-FREEPDB1}
      # Production-style JWT env (mapped from Auth0 lab vars)
      ORDS_JWT_ISSUER: ${ORDS_JWT_ISSUER:-https://${AUTH0_DOMAIN}/}
      ORDS_JWT_AUDIENCE: ${ORDS_JWT_AUDIENCE:-${AUTH0_AUDIENCE:-http://127.0.0.1:8080/mcp}}
      ORDS_JWT_JWKS_URL: ${ORDS_JWT_JWKS_URL:-https://${AUTH0_DOMAIN}/.well-known/jwks.json}
      ORDS_JWT_AUTH_SERVER_URL: ${ORDS_JWT_AUTH_SERVER_URL:-https://${AUTH0_DOMAIN}}
      ORDS_JWT_ROLE_CLAIM: ${MCP_ROLE_CLAIM:-/roles2}
      ORDS_HTTP_PORT: "8080"
      ORDS_ENABLE_HTTPS: ${ORDS_ENABLE_HTTPS:-"false"}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      MCP_HR_DB_USER: ${MCP_HR_DB_USER:-HR_MCP_RO}
      MCP_HR_DB_PASSWORD: ${MCP_HR_DB_PASSWORD:-HrMcp_ChangeMe1}
      MCP_FIN_DB_USER: ${MCP_FIN_DB_USER:-FIN_MCP_RO}
      MCP_FIN_DB_PASSWORD: ${MCP_FIN_DB_PASSWORD:-FinMcp_ChangeMe1}
      MCP_HR_ROLE: ${MCP_HR_ROLE:-POOL.HR}
      MCP_FIN_ROLE: ${MCP_FIN_ROLE:-POOL.FIN}
      MCP_HR_POOL_NAME: ${MCP_HR_POOL_NAME:-mcp-hr}
      MCP_FIN_POOL_NAME: ${MCP_FIN_POOL_NAME:-mcp-fin}
    ports:
      - "${ORDS_HTTP_PORT:-8080}:8080"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ords-config:/etc/ords/config
    networks:
      - ords-net
    restart: unless-stopped

networks:
  ords-net:
    driver: bridge

volumes:
  oracle-data:
  ords-config:
