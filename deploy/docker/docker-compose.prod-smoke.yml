# Smoke-test the production image against the lab Oracle + Auth0.
# Prerequisites: lab oracle healthy; Auth0 env; pool password files.
#
#   ./deploy/docker/build.sh
#   export IMAGE=$(cat deploy/docker/.last-image)
#   docker compose -f deploy/docker/docker-compose.prod-smoke.yml up

services:
  ords-prod:
    image: ${IMAGE:-yourlabs/ords:mcp-26.2.2.204.1619}
    environment:
      ORDS_AUTO_INIT: "true"
      ORDS_RECONFIGURE: "true"
      ORDS_JWT_ISSUER: ${ORDS_JWT_ISSUER:-https://${AUTH0_DOMAIN}/}
      ORDS_JWT_AUDIENCE: ${ORDS_JWT_AUDIENCE:-${AUTH0_AUDIENCE}}
      ORDS_JWT_JWKS_URL: ${ORDS_JWT_JWKS_URL:-https://${AUTH0_DOMAIN}/.well-known/jwks.json}
      ORDS_JWT_AUTH_SERVER_URL: ${ORDS_JWT_AUTH_SERVER_URL:-https://${AUTH0_DOMAIN}}
      ORDS_JWT_ROLE_CLAIM: ${MCP_ROLE_CLAIM:-/roles2}
      ORDS_HTTP_PORT: "8080"
    ports:
      - "${ORDS_HTTP_PORT:-8080}:8080"
    volumes:
      - ords-prod-config:/etc/ords/config
      - ../pools/smoke:/etc/ords/pools.d:ro
      - ../pools/smoke-secrets:/var/run/secrets/ords-pools:ro
    dns:
      - 1.1.1.1
      - 8.8.8.8
    extra_hosts:
      - "oracle:host-gateway"
    networks:
      - default

volumes:
  ords-prod-config:
