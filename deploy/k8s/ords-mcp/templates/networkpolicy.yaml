{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ords-mcp.fullname" . }}
  labels:
    {{- include "ords-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ords-mcp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.config.httpPort | int }}
  egress:
    # DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTPS for IdP JWKS (broad; tighten with proxy/egress gateway in prod)
    {{- if .Values.networkPolicy.idpEgress }}
    - ports:
        - protocol: TCP
          port: 443
    {{- end }}
    # Database listeners
    {{- range .Values.networkPolicy.dbEgress }}
    - to:
        - ipBlock:
            cidr: {{ .cidr }}
      ports:
        - protocol: TCP
          port: {{ .port | default 1521 }}
    {{- end }}
{{- end }}
